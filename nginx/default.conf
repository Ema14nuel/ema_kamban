server {
    listen 80;
    server_name _;

    # 1) React (SPA): si la ruta no existe como archivo, cae a index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 2) API de Django
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3) Panel de administración de Django
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4) Estáticos de Django (CSS del admin, DRF browsable API) — los sirve
    # Whitenoise dentro del proceso de Gunicorn, Nginx solo reenvía.
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    # 5) Archivos subidos (foto de perfil) — Nginx los sirve directo desde el
    # volumen compartido con "backend", sin pasar por Django.
    location /media/ {
        alias /vol/media/;
    }
}
