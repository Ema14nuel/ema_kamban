limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 3m;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Only the trusted host TLS proxy may reach this loopback-published port.
    # It MUST overwrite this header; never forward a client-supplied value.
    if ($http_x_forwarded_proto != https) { return 400; }

    location ~ ^/api/auth/(login|refresh|logout)/$ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 1) React (SPA): si la ruta no existe como archivo, cae a index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 2) API de Django
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 3) Panel de administración de Django
    location /admin/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 4) Estáticos de Django (CSS del admin, DRF browsable API) — los sirve
    # Whitenoise dentro del proceso de Gunicorn, Nginx solo reenvía.
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 5) Archivos subidos (foto de perfil) — Nginx los sirve directo desde el
    # volumen compartido con "backend", sin pasar por Django.
    location /media/ {
        alias /vol/media/;
    }
}
