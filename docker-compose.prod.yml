services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 2s
      timeout: 3s
      retries: 10
    ports:
      # Solo en loopback del host: no queda expuesto a internet (el Security
      # Group tampoco lo permitiría en 5433, pero además ni siquiera escucha
      # en 0.0.0.0). Un cliente externo (Navicat, DBeaver, etc.) se conecta
      # vía túnel SSH al 127.0.0.1:5433 del servidor. 5433 y no 5432 porque
      # ema_stickers ya usa 127.0.0.1:5432 en este mismo servidor.
      - "127.0.0.1:5433:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      DB_ENGINE: postgres
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    # No se expone al exterior: solo "web" (Nginx) le habla, por la red interna.

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    restart: always
    ports:
      - "8010:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media_volume:/vol/media:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  media_volume:
